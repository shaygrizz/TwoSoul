<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1c2f22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Вдвоём</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" aria-label="Игровое поле"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-left">
      <canvas id="portrait" width="44" height="44"></canvas>
      <div class="hud-col">
        <div id="hearts" class="hearts"></div>
        <div id="weapon-bar" class="weapon-bar hidden" aria-label="Текущее оружие">
          <div id="weapon-slots" class="weapon-slots"></div>
          <div id="weapon-name" class="weapon-name" aria-live="polite"></div>
        </div>
        <div id="super-bar" class="super-bar hidden" aria-label="Заряд суперудара">
          <span class="pip"></span><span class="pip"></span><span class="pip"></span><b class="super-key">F</b>
        </div>
        <div id="hud-sub" class="hud-sub"></div>
        <div id="hud-inv" class="hud-inv hidden">
          <span id="hud-wood" class="hud-wood hidden"><canvas id="wood-icon" width="15" height="15"></canvas><b id="wood-count">0</b></span>
        </div>
      </div>
    </div>
    <div id="trial-hud" class="trial-hud hidden">
      <div class="trial-title">Огонь и вода</div>
      <div class="trial-row">
        <span class="gem-count"><img id="gem-fire-icon" alt=""><b id="gems-fire">0/0</b></span>
        <span id="trial-time" class="trial-time">0:00</span>
        <span class="gem-count"><img id="gem-water-icon" alt=""><b id="gems-water">0/0</b></span>
      </div>
    </div>
    <button id="btn-pause" class="icon-btn pixel-btn" aria-label="Пауза"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg></button>
  </div>

  <!-- Куда убежал король -->
  <div id="king-ind" class="king-ind hidden" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M3 19l-1.5-12 6 5L12 4l4.5 8 6-5L21 19z"/><path class="band" d="M3 19h18v2H3z"/></svg>
    <span class="king-arrow"></span>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Сенсорное управление -->
  <div id="touch" class="hidden">
    <div class="joy-zone" data-joy-zone></div>
    <!-- Стик слева: до кольца — ходьба, вытянул до острых концов — бег -->
    <div class="joy-base" data-joy-base aria-hidden="true">
      <i class="joy-spike s0"></i><i class="joy-spike s1"></i><i class="joy-spike s2"></i><i class="joy-spike s3"></i>
      <div class="joy-ring round"></div>
      <div class="joy-knob round" data-joy-knob></div>
    </div>
    <div class="pad">
      <button class="pad-btn round-btn shoot" data-action="shoot" data-mode="world" aria-label="Стрельба и прицел: зажми и веди пальцем">
        <span class="aim-ring" aria-hidden="true"></span>
        <span class="aim-knob" data-aim-knob aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>
        </span>
      </button>
      <button class="pad-btn round-btn jump" data-action="jump" aria-label="Прыжок">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6M6 19l6-6 6 6"/></svg>
      </button>
      <button class="pad-btn round-btn dash" data-action="dash" data-mode="world" aria-label="Рывок">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6l6 6-6 6M12 6l6 6-6 6"/></svg>
      </button>
      <button class="pad-btn round-btn super" data-action="super" data-mode="world" aria-label="Суперудар: заряжается убийствами">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.5 6.5L21 9l-5 4.5L17.5 21 12 17l-5.5 4L8 13.5 3 9l6.5-.5z"/></svg>
      </button>
      <button class="pad-btn round-btn swap" data-action="swap" data-mode="trial" aria-label="Сменить героя">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>
      </button>
    </div>
  </div>

  <!-- Приветственный экран -->
  <div id="title" class="screen hidden">
    <div class="title-card">
      <h1 class="logo"><span id="logo-text">Вдвоём</span></h1>
      <p id="subtitle" class="subtitle"></p>
      <div class="pick-label">Кем играешь?</div>
      <div class="pick">
        <button class="hero-card" data-hero="her">
          <canvas width="72" height="96"></canvas>
          <span class="hero-name">Она</span>
          <span class="badge water">вода</span>
        </button>
        <button class="hero-card" data-hero="him">
          <canvas width="72" height="96"></canvas>
          <span class="hero-name">Он</span>
          <span class="badge fire">огонь</span>
        </button>
      </div>
      <div class="title-buttons">
        <button id="btn-continue" class="btn primary hidden">Продолжить</button>
        <button id="btn-play" class="btn primary">Играть</button>
      </div>
      <p id="title-note" class="note"></p>
      <p class="keys desktop-only">WASD — ходить · мышь — прицел · клик — атака · E, 1/2 или колёсико — оружие · Пробел — прыжок · K — рывок · Shift (зажать) — бег · Q — смена героя в испытании</p>
    </div>
  </div>

  <!-- Модальное окно -->
  <div id="modal" class="screen hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <h2 id="modal-title"></h2>
      <div id="modal-text"></div>
      <div id="modal-buttons" class="modal-buttons"></div>
    </div>
  </div>

  <div id="fade" aria-hidden="true"></div>

  <div id="loading" class="screen"><div class="loading">Загрузка…</div></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
