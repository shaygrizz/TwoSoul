<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1c2f22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Вдвоём</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" aria-label="Игровое поле"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-left">
      <canvas id="portrait" width="44" height="44"></canvas>
      <div class="hud-col">
        <div id="hearts" class="hearts"></div>
        <div id="weapon-bar" class="weapon-bar hidden" aria-label="Текущее оружие">
          <div id="weapon-slots" class="weapon-slots"></div>
          <div id="weapon-name" class="weapon-name" aria-live="polite"></div>
        </div>
        <div id="hud-sub" class="hud-sub"></div>
        <div id="hud-inv" class="hud-inv hidden">
          <span id="hud-wood" class="hud-wood hidden"><canvas id="wood-icon" width="15" height="15"></canvas><b id="wood-count">0</b></span>
        </div>
      </div>
    </div>
    <div id="trial-hud" class="trial-hud hidden">
      <div class="trial-title">Огонь и вода</div>
      <div class="trial-row">
        <span class="gem-count"><img id="gem-fire-icon" alt=""><b id="gems-fire">0/0</b></span>
        <span id="trial-time" class="trial-time">0:00</span>
        <span class="gem-count"><img id="gem-water-icon" alt=""><b id="gems-water">0/0</b></span>
      </div>
    </div>
    <button id="btn-pause" class="icon-btn pixel-btn" aria-label="Пауза"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg></button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Сенсорное управление -->
  <div id="touch" class="hidden">
    <div class="joy-zone" data-joy-zone></div>
    <div class="joy-base pixel-btn" data-joy-base><div class="joy-knob pixel-btn" data-joy-knob></div></div>
    <div class="pad">
      <button class="pad-btn pixel-btn weapon" data-action="switch" data-mode="world" aria-label="Сменить оружие">
        <svg class="ico-ak" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 11h15l3-2h2v3h-4l-1 1h-4l-1 4h-3l1-4H2z"/></svg>
        <svg class="ico-axe hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20L15 10M13 5c3-2 7 0 7 4l-4 1-3-2z"/></svg>
      </button>
      <button class="pad-btn pixel-btn dash" data-action="dash" data-mode="world" aria-label="Рывок">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6l6 6-6 6M12 6l6 6-6 6"/></svg>
      </button>
      <button class="pad-btn pixel-btn sprint" data-action="sprint" data-mode="world" aria-label="Бег: держи нажатой">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L6 13h5l-1 8 7-10h-5z"/></svg>
      </button>
      <button class="pad-btn pixel-btn swap" data-action="swap" data-mode="trial" aria-label="Сменить героя">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>
      </button>
      <button class="pad-btn pixel-btn jump" data-action="jump" aria-label="Прыжок">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6M6 19l6-6 6 6"/></svg>
      </button>
      <button class="pad-btn pixel-btn shoot" data-action="shoot" data-mode="world" aria-label="Стрельба и прицел: зажми и веди пальцем">
        <span class="aim-ring" aria-hidden="true"></span>
        <span class="aim-knob" data-aim-knob aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>
        </span>
      </button>
    </div>
  </div>

  <!-- Приветственный экран -->
  <div id="title" class="screen hidden">
    <div class="title-card">
      <h1 class="logo"><span id="logo-text">Вдвоём</span></h1>
      <p id="subtitle" class="subtitle"></p>
      <div class="pick-label">Кем играешь?</div>
      <div class="pick">
        <button class="hero-card" data-hero="her">
          <canvas width="72" height="96"></canvas>
          <span class="hero-name">Она</span>
          <span class="badge water">вода</span>
        </button>
        <button class="hero-card" data-hero="him">
          <canvas width="72" height="96"></canvas>
          <span class="hero-name">Он</span>
          <span class="badge fire">огонь</span>
        </button>
      </div>
      <div class="title-buttons">
        <button id="btn-continue" class="btn primary hidden">Продолжить</button>
        <button id="btn-play" class="btn primary">Играть</button>
      </div>
      <p id="title-note" class="note"></p>
      <p class="keys desktop-only">WASD — ходить · мышь — прицел · клик — атака · E, 1/2 или колёсико — оружие · Пробел — прыжок · K — рывок · Shift (зажать) — бег · Q — смена героя в испытании</p>
    </div>
  </div>

  <!-- Модальное окно -->
  <div id="modal" class="screen hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <h2 id="modal-title"></h2>
      <div id="modal-text"></div>
      <div id="modal-buttons" class="modal-buttons"></div>
    </div>
  </div>

  <div id="fade" aria-hidden="true"></div>

  <div id="loading" class="screen"><div class="loading">Загрузка…</div></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
